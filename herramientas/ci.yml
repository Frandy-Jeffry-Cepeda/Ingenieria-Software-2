# =====================================================================
#  Integración continua — Sistema de Inventario de Equipos de TI
#  INF-5250 · Equipo 6
#
#  Verifica que el servidor compile en cada solicitud de fusión hacia
#  main. Si falla, GitHub bloquea la fusión.
# =====================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  construir-servidor:
    name: Compilar el servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Compilar
        working-directory: backend
        run: npm run build

  construir-interfaz:
    name: Compilar la interfaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar
        working-directory: frontend
        run: npm run build
